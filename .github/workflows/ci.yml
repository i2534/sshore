name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build frontend (embed assets for go:embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npx vitest run
      - name: Build
        run: npm run build

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install webkit2gtk-4.1 + UPX build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev upx-ucl
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build linux/amd64 (webkit2_41 tag via Makefile)
        run: make linux
      - name: Upload linux binary
        uses: actions/upload-artifact@v7
        with:
          name: sshore-linux
          path: build/bin/sshore

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Install UPX
        run: choco install upx -y
      - name: Build windows/amd64 (packaged, icon via .syso)
        run: wails build -platform windows/amd64 -skipbindings -ldflags "-s -w" -trimpath -upx
      - name: Upload windows binary
        uses: actions/upload-artifact@v7
        with:
          name: sshore-windows
          path: build/bin/sshore.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/sshore-linux/sshore \
            artifacts/sshore-windows/sshore.exe 2>/dev/null \
          || gh release upload "$GITHUB_REF_NAME" \
            artifacts/sshore-linux/sshore \
            artifacts/sshore-windows/sshore.exe --clobber
