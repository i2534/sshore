name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '手动发布：构建后上传二进制到该 release tag'
        required: false
        type: string

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build frontend (embed assets for go:embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1

  # Windows 上才会执行的分支（osutil 的 CREATE_NO_WINDOW/Cancel、sftp 的 isWindows
  # 每命令模式、app.go 的卷根判断、%APPDATA% 配置路径、Windows OpenSSH 的 ls 输出形状等）
  # 在 ubuntu 的 go job 里覆盖不到，这里在真实 Windows runner 上跑同一套测试。
  # 不加 -race：Windows 上 race 检测需要 C 工具链，而 ubuntu job 已用 -race 覆盖竞态检测。
  go-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build frontend (embed assets for go:embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet (windows)
        run: go vet ./...
      - name: Test (windows)
        run: go test ./... -count=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npx vitest run
      - name: Build
        run: npm run build

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install webkit2gtk-4.1 + UPX build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev upx-ucl
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build linux/amd64 (webkit2_41 tag via Makefile)
        run: make linux
      - name: Package linux/amd64 (versioned, platform-suffixed)
        shell: bash
        run: |
          VERSION="$(git describe --tags 2>/dev/null || echo dev)"
          mkdir -p build/pkg build/dist
          cp build/bin/sshore README.md LICENSE build/pkg/
          tar -czf "build/dist/sshore-${VERSION}-linux-amd64.tar.gz" -C build/pkg .
          ls -la build/dist
      - name: Upload linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: sshore-linux
          path: build/dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Install UPX
        run: choco install upx -y
      - name: Build windows/amd64 (packaged, icon via .syso; version injected)
        shell: bash
        run: |
          VERSION="$(git describe --tags 2>/dev/null || echo dev)"
          wails build -platform windows/amd64 -skipbindings -ldflags "-s -w -X main.Version=$VERSION" -trimpath -upx
      - name: Package windows/amd64 (versioned, platform-suffixed)
        shell: pwsh
        run: |
          $v = (git describe --tags 2>$null)
          if (-not $v) { $v = "dev" }
          New-Item -ItemType Directory -Force build/pkg, build/dist | Out-Null
          Copy-Item build/bin/sshore.exe, README.md, LICENSE build/pkg/
          Compress-Archive -Path "build/pkg/*" -DestinationPath "build/dist/sshore-$v-windows-amd64.zip" -Force
          Get-ChildItem build/dist | Select-Object Name, Length
      - name: Upload windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: sshore-windows
          path: build/dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "workflow_dispatch 需要 release_tag 输入" >&2
            exit 1
          fi
          # 只上传打包产物（.tar.gz/.zip）：文件名自带版本与平台，且压缩包不会
          # 触发浏览器对可执行文件的"可能有害/删除"拦截。
          mapfile -t FILES < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "没有找到可上传的打包产物" >&2
            exit 1
          fi
          printf 'release %s:\n' "$RELEASE_TAG"
          printf '  %s\n' "${FILES[@]}"
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            "${FILES[@]}" 2>/dev/null \
          || gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber
